# test_scripts.yaml

---

defaults:
  pinMode: null
  digitalWrite: null
  digitalToggle: null

  serial_begin: null
  serial_print_double: 4
  serial_println_double: 4
  serial_println_long: 4
  serial_println_str: 4
  serial_println_ulong: 4
  serial_println_void: 4
  serial_print_long: 4
  serial_print_str: 4
  serial_print_ulong: 4
  serial_available: 0

  sendRequest: null

  delay: null
  delayMicroseconds: null
  micros: 1000
  TwoWire_begin_void: null
  TwoWire_begin: null
  TwoWire_end: null
  TwoWire_setClock: null
  TwoWire_beginTransmission: null

  load_encoders: pass-through
  clear_displays: pass-through
  update_displays: pass-through
  update_channel_memory: pass-through
  update_harmonic_memory: pass-through
  load_functions: pass-through
  run_event: pass-through
  encoder_changed: pass-through
  switch_closed: pass-through
  switch_opened: pass-through
  channel_on: pass-through
  run_event: pass-through
  run_event: pass-through
  run_event: pass-through
  run_event: pass-through
  run_event: pass-through
  run_event: pass-through
  run_event: pass-through
  run_event: pass-through
  get_EEPROM:
    "0": 78  # 20000
    "1": 32
    "2": 3   # 1000
    "3": 232

setup:
  defaults: {}

  script: |
    < call setup
      > fun_called millis
        < return 100
      > returned
    < report encoders
      > FN: D FUNCTION_CHANGED UPDATE_CHOICES -
      > P1: N FUN_PARAM_CHANGED - -
      > P2: N FUN_PARAM_CHANGED - -
      > P3: N FUN_PARAM_CHANGED - -
      > P4: N FUN_PARAM_CHANGED - -

ch_switch_on:
  defaults:
    turn_off_choices_leds: null
    clear_numeric_display: null
    getResponse: 2

  script: |
    < set Response_data 0 = 0   # Errno from LED controller
      > set_global . 0
    < set Response_data 1 = 0   # Err_data from LED controller
      > set_global . 0
    < set Switches 56 current = 1   # turn on CH-2 switch
      > set_global . 0
    < call switch_closed 56
      > returned


  # interesting things in loop:
  #
  # set Switches sw current = X
  # call switch_closed sw
  # call switch_opened sw
  #
  # set Encoders enc var value = X
  # call encoder_changed enc (only if var set and flags not DISABLED)
  #
  # periodics:
  #
  # call notes_on
  # call notes_off
  # call pot_changed pot (calls send_pot if trigger set: Pot_trigger pot == 0xFF
  #                                                      or Triggers[Pot_trigger[pot]].continuous)
  # call send_pot pot

  # get Encoders FUNCTION_ENCODER (0-3 are fn args) encoder_event (when encoder changes)
  #                                                 var (is var set?)
  #                                                 var value
  #                                                 var var_type
  #                                                              flags (DISABLED is 1)
  #                                                              display_value (event)
  #                                                              <subclass> ...
  # FUNCTION_ENCODER   4
  #
  # set Switches sw current = 0 or 1
  # get Switch_closed_event sw
  # get Switch_opened_event sw
  #
  # FIRST_HARMONIC_SWITCH   36
  # FIRST_CHANNEL_SWITCH    54  (54 is actually the "Synth" switch)
  # Function stream switch  33
  # Function stream button  46
  # Ch Vol,Note-on/off stream switch  34
  # Ch Vol,Note-on/off stream button  47
  # Note Switches           48-53
  # Note Buttons            72-77
  # Note Cont/Pulse switch  35

# vim: sw=2 ic
