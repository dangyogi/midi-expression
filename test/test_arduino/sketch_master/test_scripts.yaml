# test_scripts.yaml

---

defaults:
  pinMode: null
  digitalWrite: null
  digitalToggle: null

  serial_begin: null
  serial_print_double: 4
  serial_println_double: 4
  serial_println_long: 4
  serial_println_str: 4
  serial_println_ulong: 4
  serial_println_void: 4
  serial_print_long: 4
  serial_print_str: 4
  serial_print_ulong: 4
  serial_available: 0

  sendRequest: null

  delay: null
  delayMicroseconds: null
  micros: 1000
  TwoWire_begin_void: null
  TwoWire_begin: null
  TwoWire_end: null
  TwoWire_setClock: null
  TwoWire_beginTransmission: null
  usb_midi_flush_output: null
  usb_midi_send: null

  load_encoders: pass-through
  clear_displays: pass-through
  update_displays: pass-through
  turn_off_choices_leds: pass-through
  clear_numeric_display: pass-through
  update_channel_memory: pass-through
  update_harmonic_memory: pass-through
  load_functions: pass-through
  run_event: pass-through
  encoder_changed: pass-through
  switch_closed: pass-through
  switch_opened: pass-through
  channel_on: pass-through
  run_event: pass-through
  get_EEPROM:
    "0": 78  # 20000
    "1": 32
    "2": 3   # 1000
    "3": 232

setup:
  defaults: {}

  script: |
    < call setup
      > fun_called millis
        < millis return 100
      > setup returned
    < report encoders
      > ENC F encoder_event display_value value min max
      > FN: D FUNCTION_CHANGED UPDATE_CHOICES - - -
      > P1: N FUN_PARAM_CHANGED - - - -
      > P2: N FUN_PARAM_CHANGED - - - -
      > P3: N FUN_PARAM_CHANGED - - - -
      > P4: N FUN_PARAM_CHANGED - - - -
    < set Current_pot_value 0 = 5
      > set_global . 0
    < set Current_pot_value 1 = 10
      > set_global . 0
    < set Current_pot_value 2 = 15
      > set_global . 0
    < set Current_pot_value 3 = 20
      > set_global . 0
    < set Current_pot_value 4 = 25
      > set_global . 0
    < set Current_pot_value 5 = 30
      > set_global . 0
    < set Current_pot_value 6 = 35
      > set_global . 0
    < set Current_pot_value 7 = 40
      > set_global . 0
    < set Current_pot_value 8 = 45
      > set_global . 0
    < set Current_pot_value 9 = 50
      > set_global . 0
    < set Current_pot_value 10 = 55
      > set_global . 0
    < set Current_pot_value 11 = 60
      > set_global . 0
    < set Current_pot_value 12 = 65
      > set_global . 0
    < set Current_pot_value 13 = 70
      > set_global . 0
    < set Current_pot_value 14 = 75
      > set_global . 0
    < set Current_pot_value 15 = 80
      > set_global . 0
    < set Current_pot_value 16 = 85
      > set_global . 0
    < set Current_pot_value 17 = 90
      > set_global . 0
    < set Current_pot_value 18 = 95
      > set_global . 0
    < set Current_pot_value 19 = 100
      > set_global . 0

ch2_switch_on:
  defaults:
    getResponse: 2

  script: |
    < set Response_data 0 = 0   # Errno from LED controller
      > set_global . 0
    < set Response_data 1 = 0   # Err_data from LED controller
      > set_global . 0
    < set Switches 56 current = 1   # turn on CH-2 switch
      > set_global . 0
    < call switch_closed 56
      > switch_closed returned
    < report encoders
      > ENC F encoder_event display_value value min max
      > FN: E FUNCTION_CHANGED UPDATE_CHOICES 0 0 7
      > P1: E FUN_PARAM_CHANGED UPDATE_SHARPS_FLATS 7 0 14
      > P2: D FUN_PARAM_CHANGED 0xFF - - -
      > P3: D FUN_PARAM_CHANGED 0xFF - - -
      > P4: E FUN_PARAM_CHANGED UPDATE_CHOICES 0 0 1

ch2_switch_off:
  defaults:
    getResponse: 2

  script: |
    < set Response_data 0 = 0   # Errno from LED controller
      > set_global . 0
    < set Response_data 1 = 0   # Err_data from LED controller
      > set_global . 0
    < set Switches 56 current = 0   # turn off CH-2 switch
      > set_global . .
    < call switch_opened 56
      > switch_opened returned
    < report encoders
      > ENC F encoder_event display_value value min max
      > FN: N FUNCTION_CHANGED - - - -
      > P1: N FUN_PARAM_CHANGED - - - -
      > P2: N FUN_PARAM_CHANGED - - - -
      > P3: N FUN_PARAM_CHANGED - - - -
      > P4: N FUN_PARAM_CHANGED - - - -

ch4_switch_on:
  defaults:
    turn_off_choices_leds: null
    clear_numeric_display: null
    getResponse: 2

  script: |
    < set Response_data 0 = 0   # Errno from LED controller
      > set_global . 0
    < set Response_data 1 = 0   # Err_data from LED controller
      > set_global . 0
    < set Switches 58 current = 1   # turn on CH-4 switch
      > set_global . 0
    < call switch_closed 58
      > switch_closed returned
    < report encoders
      > ENC F encoder_event display_value value min max
      > FN: E FUNCTION_CHANGED UPDATE_CHOICES 0 0 7
      > P1: E FUN_PARAM_CHANGED UPDATE_SHARPS_FLATS 7 0 14
      > P2: D FUN_PARAM_CHANGED 0xFF - - -
      > P3: D FUN_PARAM_CHANGED 0xFF - - -
      > P4: E FUN_PARAM_CHANGED UPDATE_CHOICES 0 0 1

ch4_switch_off:
  defaults:
    turn_off_choices_leds: null
    clear_numeric_display: null
    getResponse: 2

  script: |
    < set Response_data 0 = 0   # Errno from LED controller
      > set_global . 0
    < set Response_data 1 = 0   # Err_data from LED controller
      > set_global . 0
    < set Switches 58 current = 0   # turn off CH-4 switch
      > set_global . .
    < call switch_opened 58
      > switch_opened returned
    < report encoders
      > ENC F encoder_event display_value value min max
      > FN: N FUNCTION_CHANGED - - - -
      > P1: N FUN_PARAM_CHANGED - - - -
      > P2: N FUN_PARAM_CHANGED - - - -
      > P3: N FUN_PARAM_CHANGED - - - -
      > P4: N FUN_PARAM_CHANGED - - - -


  # interesting things in loop:
  #
  # set Switches sw current = X
  # call switch_closed sw
  # call switch_opened sw
  #
  # set Encoders enc var value = X
  # call encoder_changed enc (only if var set and flags not DISABLED)
  #
  # periodics:
  #
  # call notes_on
  # call notes_off
  #
  # call pot_changed pot (calls send_pot if trigger set: Pot_trigger pot == 0xFF
  #                                                      or Triggers[Pot_trigger[pot]].continuous)
  # call send_pot pot
  #
  # set Current_pot_value pot = X
  # set Synced_pot_value pot = X    # last pot_value sent, initially 0

  # get Encoders FUNCTION_ENCODER (0-3 are fn args) encoder_event (when encoder changes)
  #                                                 var (is var set?)
  #                                                 var value
  #                                                 var var_type
  #                                                              flags (DISABLED is 1)
  #                                                              display_value (event)
  #                                                              <subclass> ...
  # FUNCTION_ENCODER   4
  #
  # set Switches sw current = 0 or 1
  # get Switch_closed_event sw
  # get Switch_opened_event sw
  #
  # FIRST_HARMONIC_SWITCH   36
  # FIRST_CHANNEL_SWITCH    54  (54 is actually the "Synth" switch)
  # Function stream switch  33
  # Function stream button  46
  # Ch Vol,Note-on/off stream switch  34
  # Ch Vol,Note-on/off stream button  47
  # Note Switches           48-53
  # Note Buttons            72-77
  # Note Cont/Pulse switch  35

# vim: sw=2 ic
